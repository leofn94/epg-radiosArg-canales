name: Scrapper web

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas (minuto 0)
    - cron: '0 */4 * * *'
  # Mantiene la opción de ejecutarlo manualmente cuando quieras
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scrapper

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 gspread google-auth pandas openpyxl
          playwright install chromium
          playwright install-deps

      # --- VERIFICACIÓN DE FRECUENCIA PARA MITV ---
      - name: Verificar si corresponde ejecutar MITV (Cada 3 días)
        id: check_mitv
        run: |
          # Si se dispara manualmente (workflow_dispatch) o el día del año es múltiplo de 3, se activa.
          DAY_OF_YEAR=$(date +%j)
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((10#$DAY_OF_YEAR % 3)) -eq 0 ]; then
            # Solo corre a la medianoche (00:00 UTC) del día correspondiente para no repetir 8 veces ese día
            HOUR=$(date +%H)
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" -eq "00" ]; then
              echo "run_mitv=true" >> $GITHUB_OUTPUT
            else
              echo "run_mitv=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "run_mitv=false" >> $GITHUB_OUTPUT
          fi

      - name: Ejecutar script de MITV_Clasica
        if: steps.check_mitv.outputs.run_mitv == 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python MITV_Clasica.py

      # --- EL RESTO DE LOS CANALES SIGUEN IGUAL (CADA 3 HORAS) ---
      - name: Ejecutar script de retroblast
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python retroblast.py
        
      - name: Ejecutar script de CN City
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python cncity.py

      - name: Ejecutar script de Janimotion
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python janimotion.py

      - name: Ejecutar script de Doble C
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python doblec.py
